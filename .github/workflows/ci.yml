name: EnergyIQ CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend PyTest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Seeder
        run: |
          python -m backend.database.db

      - name: Execute PyTest Integration Suite
        run: |
          python -m pytest tests/ -v

      - name: Execute ML Reproducible Benchmark Experiment
        run: |
          python experiments/run_benchmark.py

  frontend-build:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        cwd: frontend
        run: |
          npm ci

      - name: Execute Vite Production Build
        cwd: frontend
        run: |
          npm run build
